name: Daily Lead Sentinel
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # UPGRADED TO THE 2026 STANDARD

      - name: Install Dependencies
        run: |
          pip install google-genai requests firebase-admin # Modern SDKs

      - name: Run Sentinel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          FIREBASE_KEY_PATH: ${{ secrets.FIREBASE_KEY_PATH }}
        run: python sentinel.py
