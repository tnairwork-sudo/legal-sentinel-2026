<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel // Tushar Nair Command Center</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Inter', sans-serif; padding: 40px; }
        .header { border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .card { background: #161616; border: 1px solid #222; padding: 25px; border-radius: 8px; transition: 0.3s; }
        .card:hover { border-color: #d4af37; }
        .company { font-size: 1.2em; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .meta { color: #888; font-size: 0.9em; margin-bottom: 15px; }
        .btn { background: #d4af37; color: #000; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        pre { background: #000; padding: 15px; border-radius: 4px; font-size: 0.8em; overflow-x: auto; white-space: pre-wrap; color: #ccc; }
    </style>
</head>
<body>
    <div class="header">
        <h1>SENTINEL COMMAND</h1>
        <p>Strategic Risk & Retainer Intelligence // April 2026</p>
    </div>
    <div class="grid" id="lead-grid">
        </div>

    </body>
</html>
