<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Command | Tushar Nair SC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(at 0% 0%, rgba(184, 134, 11, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(184, 134, 11, 0.03) 0px, transparent 50%);
            font-family: 'Inter', sans-serif;
            color: #e5e5e5;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(184, 134, 11, 0.4);
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #B8860B 0%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .yoshiki-pattern {
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="min-h-screen p-8 relative overflow-x-hidden">
    <div class="yoshiki-pattern absolute inset-0 pointer-events-none"></div>

    <header class="max-w-7xl mx-auto mb-12 flex justify-between items-end">
        <div>
            <h1 class="text-5xl font-bold mb-2 gold-gradient tracking-tight" style="font-family: 'Playfair Display';">Sentinel Command</h1>
            <p class="text-sm uppercase tracking-widest text-gray-500">Strategic Risk Intelligence // Tushar Nair SC Advocate</p>
        </div>
        <div class="text-right">
            <div id="status-pulse" class="inline-block w-3 h-3 bg-yellow-600 rounded-full animate-pulse mr-2"></div>
            <span class="text-xs uppercase font-semibold text-gray-400">Live Resilience Feed</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-12 gap-8">
        
        <div class="col-span-12 lg:col-span-4 space-y-8">
            <div class="glass-card p-6">
                <h3 class="text-xs uppercase tracking-widest text-gray-400 mb-6 font-semibold">2026 Risk Distribution</h3>
                <canvas id="riskChart" class="w-full"></canvas>
            </div>
            
            <div class="glass-card p-6">
                <h3 class="text-xs uppercase tracking-widest text-gray-400 mb-6 font-semibold">Retainer Potential (MRR)</h3>
                <div class="text-4xl font-light text-white mb-2">$<span id="revenue-projection">45,000</span></div>
                <div class="w-full bg-gray-800 h-1 rounded-full overflow-hidden">
                    <div class="bg-yellow-600 h-full w-2/5"></div>
                </div>
                <p class="text-[10px] text-gray-500 mt-2">Projection based on current April 1st Regulatory triggers.</p>
            </div>
        </div>

        <div class="col-span-12 lg:col-span-8">
            <div id="leads-container" class="grid grid-cols-1 gap-6">
                <div class="glass-card p-12 text-center text-gray-500">
                    <p class="animate-pulse">Accessing Secure Firestore Node...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
            projectId: "tnlaw-87ba6", 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ANALYTICS SETUP
        const ctx = document.getElementById('riskChart').getContext('2d');
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Electricity', 'Philanthropy', 'FDI', 'Taxation', 'CSR', 'Governance'],
                datasets: [{
                    label: 'Sector Risk Level',
                    data: [95, 80, 70, 60, 50, 85],
                    backgroundColor: 'rgba(184, 134, 11, 0.2)',
                    borderColor: '#B8860B',
                    borderWidth: 1,
                    pointBackgroundColor: '#FFD700'
                }]
            },
            options: {
                scales: { r: { grid: { color: '#333' }, ticks: { display: false } } },
                plugins: { legend: { display: false } }
            }
        });

        // DATA SYNC
        db.collection("sentinel_leads").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const container = document.getElementById("leads-container");
            container.innerHTML = "";
            
            snapshot.forEach((doc) => {
                const lead = doc.data();
                const card = `
                    <div class="glass-card p-8 group">
                        <div class="flex justify-between items-start mb-6">

                                <p class="text-gray-400 text-sm italic">${lead.company}</p>
                            </div>
